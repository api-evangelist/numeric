name: Numeric
description: >-
  Numeric is an AI close-automation platform that unifies close management, financial
  reporting, and cash operations for complex, high-volume accounting teams (customers
  include Brex, Plaid, and Stash). Its products span close checklists and account
  reconciliation, cash matching and journal-entry automation with bank integrations,
  and an analytics suite for flux/variance analysis and CFO-ready reporting. Numeric's
  programmable surface is an OAuth 2.0 / OIDC-protected Model Context Protocol (MCP)
  server at api.numeric.io/mcp, paired with a published library of Claude Agent Skills
  ("Numeric Toolkit") that automate month-end close, accruals, reconciliation, audit
  evidence export, and board-ready reporting. Backed by IVP and Menlo Ventures.
